name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main

env:
  REGISTRY: ebana.registry.twcstorage.ru
  IMAGE_NAME: basis-test
  APP_NAME: basis-test
  NETWORK: BASIS_NETWORK
  NETWORK_ALIAS: api
  IMAGE: ebana.registry.twcstorage.ru/basis-test:latest

jobs:

  ############################################################
  # TESTS (pytest + testcontainers; нужен Docker на раннере)
  ############################################################
#  tests:
#    runs-on: ubuntu-latest
#
#    # Settings требует эти переменные (нет дефолтов);
#    # тесты ходят в testcontainers.
#    env:
#      POSTGRES_USER: test
#      POSTGRES_PASSWORD: test
#      POSTGRES_DB: test
#
#    steps:
#      - uses: actions/checkout@v4
#
#      # Poetry нужен до setup-python: с cache: "poetry" action вызывает poetry для расчёта cache key.
#      - name: Install Poetry
#        run: pipx install poetry==2.4.1
#
#      - uses: actions/setup-python@v5
#        with:
#          python-version: "3.12"
#          cache: "poetry"
#
#      - name: Install dependencies
#        run: poetry install --no-interaction --no-ansi --no-root
#
#      - name: Lint
#        run: poetry run ruff check src tests
#
#      - name: Run tests
#        run: poetry run pytest -q

  ############################################################
  # BUILD (Dockerfile -> registry: $sha и latest)
  ############################################################
  build:
#    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: token
          password: ${{ secrets.REGISTRY_API_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ############################################################
  # DEPLOY (Blue-Green Zero Downtime)
  ############################################################
  deploy:
#    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary

      - name: Add host to known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |

            set -e

            APP_NAME="${{ env.APP_NAME }}"
            NETWORK="${{ env.NETWORK }}"
            NETWORK_ALIAS="${{ env.NETWORK_ALIAS }}"
            IMAGE="${{ env.IMAGE }}"
            REPO="${{ github.repository }}"

            echo "===== Docker login ====="
            echo "${{ secrets.REGISTRY_API_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u token --password-stdin

            echo "===== Preparing project directory ====="
            mkdir -p apps
            cd apps

            if [ ! -d "$APP_NAME" ]; then
              git clone "https://x-access-token:${{ secrets.ACCESS_TOKEN }}@github.com/$REPO.git" "$APP_NAME"
            fi

            cd "$APP_NAME"

            echo "===== Update code ====="
            git fetch origin
            git reset --hard origin/main

            echo "===== Update .env ====="
            cat > .env <<EOF
            APP_NAME=$APP_NAME
            IMAGE=$IMAGE
            ENVIRONMENT=${{ secrets.ENVIRONMENT || 'production' }}
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL || 'amqp://guest:guest@localhost:5672/' }}
            PAYMENTS_API_KEYS=${{ secrets.PAYMENTS_API_KEYS || '["dev-key"]' }}
            WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET || 'webhook-dev-secret' }}
            EOF

            echo "===== Pull latest image ====="
            docker pull "$IMAGE"

            echo "===== Ensure docker network exists ====="
            docker network inspect "$NETWORK" >/dev/null 2>&1 || docker network create "$NETWORK"

            echo "===== Ensure database is running ====="
            docker compose -f docker-compose.bluegreen.yml up -d db
            ATTEMPTS=30
            until [ "$(docker inspect --format='{{.State.Health.Status}}' "$APP_NAME-db" 2>/dev/null)" = "healthy" ]; do
              ATTEMPTS=$((ATTEMPTS-1))
              if [ $ATTEMPTS -le 0 ]; then
                echo "Database is not healthy."
                docker logs --tail 50 "$APP_NAME-db" 2>&1 || true
                exit 1
              fi
              sleep 2
            done

            echo "===== Run migrations ====="
            docker run --rm --env-file .env --network "$NETWORK" "$IMAGE" alembic upgrade head

            echo "===== Start observability stack ====="
            docker compose -f docker-compose.bluegreen.yml up -d rabbitmq consumer postgres-exporter prometheus loki promtail grafana

            echo "===== Detect active container ====="

            BLUE_RUNNING=false
            GREEN_RUNNING=false

            if docker ps --format '{{.Names}}' | grep -q "^$APP_NAME-blue$"; then
              BLUE_RUNNING=true
            fi

            if docker ps --format '{{.Names}}' | grep -q "^$APP_NAME-green$"; then
              GREEN_RUNNING=true
            fi

            if [ "$BLUE_RUNNING" = true ]; then
              ACTIVE="blue"
              TARGET="green"
            elif [ "$GREEN_RUNNING" = true ]; then
              ACTIVE="green"
              TARGET="blue"
            else
              echo "First deploy — no active container"
              ACTIVE=""
              TARGET="blue"
            fi

            echo "Active: $ACTIVE"
            echo "Deploying to: $TARGET"

            echo "===== Remove old TARGET ====="
            docker compose -f docker-compose.bluegreen.yml stop web-$TARGET 2>/dev/null || true
            docker compose -f docker-compose.bluegreen.yml rm -f web-$TARGET 2>/dev/null || true

            echo "===== Start TARGET ====="
            docker compose -f docker-compose.bluegreen.yml up -d web-$TARGET

            echo "===== Wait for healthcheck ====="
            ATTEMPTS=60

            until [ "$(docker inspect --format='{{.State.Health.Status}}' "$APP_NAME-$TARGET" 2>/dev/null)" = "healthy" ]; do
              ATTEMPTS=$((ATTEMPTS-1))
              if [ $ATTEMPTS -le 0 ]; then
                echo "New container is not healthy. Rollback."
                docker compose -f docker-compose.bluegreen.yml stop web-$TARGET || true
                docker compose -f docker-compose.bluegreen.yml rm -f web-$TARGET || true
                exit 1
              fi
              sleep 2
            done

            echo "===== Readiness probe ====="
            docker exec "$APP_NAME-$TARGET" curl -fsS http://localhost:8000/health/readiness

            echo "===== TARGET healthy ====="

            echo "===== Switch network alias ====="

            docker network connect --alias "$NETWORK_ALIAS" "$NETWORK" "$APP_NAME-$TARGET" 2>/dev/null || true

            if [ -n "$ACTIVE" ]; then
              docker network disconnect "$NETWORK" "$APP_NAME-$ACTIVE" 2>/dev/null || true
            fi

            echo "===== Update host nginx backend ====="
            BACKEND_PORT=8001
            if [ "$TARGET" = "green" ]; then
              BACKEND_PORT=8002
            fi
            mkdir -p /etc/nginx/snippets
            printf 'set $api_backend http://127.0.0.1:%s;\n' "$BACKEND_PORT" > /etc/nginx/snippets/basis-test-backend.conf
            nginx -t >/dev/null 2>&1 && nginx -s reload

            echo "===== Stop old container ====="
            if [ -n "$ACTIVE" ]; then
              docker compose -f docker-compose.bluegreen.yml stop web-$ACTIVE || true
            fi

            echo "===== Cleanup dangling images ====="
            docker image prune -f

            echo "===== DEPLOY SUCCESS (Blue-Green Zero-Downtime) ====="
