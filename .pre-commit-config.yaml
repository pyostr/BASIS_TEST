repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]

      - id: ruff-format
        stages: [pre-commit]

      - id: ruff
        name: ruff check (pre-push)
        stages: [pre-push]

      - id: ruff-format
        name: ruff format check (pre-push)
        args: [--check]
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: poetry run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
