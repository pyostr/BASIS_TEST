# Host nginx: demo-market.ru -> basis-test API (blue/green).
# Файл кладётся на сервер в /etc/nginx/sites-available/demo-market.ru
#   + симлинк в /etc/nginx/sites-enabled/ (или прямо в /etc/nginx/conf.d/).
#
# Бэкенд (какой контейнер сейчас активен) переключает деплой:
# он пишет в /etc/nginx/snippets/basis-test-backend.conf строку вида
#   set $api_backend http://127.0.0.1:8001;   # blue
#   set $api_backend http://127.0.0.1:8002;   # green
# и делает `nginx -s reload`.
# Snippet лежит в /etc/nginx/snippets/, чтобы не попадать в глобальный include conf.d/*.
#
# Перед первым деплоем создайте snippet вручную:
#   echo 'set $api_backend http://127.0.0.1:8001;' | sudo tee /etc/nginx/snippets/basis-test-backend.conf

server {
    listen 80;
    server_name demo-market.ru www.demo-market.ru api.demo-market.ru;

    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/snippets/basis-test-backend.conf;
        proxy_pass $api_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS после запуска:
#   sudo certbot --nginx -d demo-market.ru -d www.demo-market.ru -d api.demo-market.ru
