# Host nginx: grafana.demo-market.ru -> Grafana (loopback 127.0.0.1:3003).
# Файл кладётся на сервер в /etc/nginx/sites-available/grafana.demo-market.ru
#   + симлинк в /etc/nginx/sites-enabled/.
# Grafana слушает на loopback-порту 3003 (см. docker-compose.bluegreen.yml), наружу не публикуется.

server {
    listen 80;
    server_name grafana.demo-market.ru;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3003;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}

# HTTPS после запуска:
#   sudo certbot --nginx -d grafana.demo-market.ru
