# Прод-nginx для demo-market.ru → API basis-test (blue/green).
# Запускается как контейнер в сети BASIS_NETWORK (см. README ниже в файле).
# Трафик идёт на alias 'api' — при ротации blue→green адрес меняется,
# поэтому имя резолвится через Docker DNS на каждый запрос (resolver).
user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # Docker embedded DNS: 'api' alias внутри BASIS_NETWORK.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    server {
        listen 80;
        server_name demo-market.ru www.demo-market.ru api.demo-market.ru;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            set $backend "http://api:8000";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

# HTTPS: после запуска выполните на сервере
#   certbot --nginx -d demo-market.ru -d www.demo-market.ru -d api.demo-market.ru
# certbot сам добавит server block для :443 и redirect.
