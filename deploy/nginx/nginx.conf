# Единая точка входа: все HTTP-обращения к сервисам идут через этот nginx.
# Маршрутизация по поддоменам *.localhost (резолвятся в loopback без /etc/hosts).
#   localhost            -> список сервисов (landing)
#   api.localhost        -> FastAPI (плюс /docs, /metrics, /api/v1)
#   consumer.localhost   -> HTTP-метрики consumer-воркера
#   prometheus.localhost -> Prometheus
#   grafana.localhost    -> Grafana
#   loki.localhost       -> Loki API
#   rabbitmq.localhost   -> RabbitMQ Management UI
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # Медленные запросы дашбордов/графиков: не рвём соединение раньше времени.
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Базовые заголовки, единые для всех бэкендов.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api       { server api:8000; }
    upstream consumer  { server consumer:8001; }
    upstream prometheus{ server prometheus:9090; }
    upstream grafana   { server grafana:3000; }
    upstream loki      { server loki:3100; }
    upstream rabbitmq  { server rabbitmq:15672; }

    # Landing: общий список сервисов на http://localhost
    server {
        listen 80;
        server_name localhost _;

        root  /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # FastAPI
    server {
        listen 80;
        server_name api.localhost;

        client_max_body_size 1m;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Метрики consumer-воркера (HTTP-сервер на 8001)
    server {
        listen 80;
        server_name consumer.localhost;

        location / {
            proxy_pass http://consumer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Prometheus
    server {
        listen 80;
        server_name prometheus.localhost;

        location / {
            proxy_pass http://prometheus;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Grafana (WebSocket для live-обновлений дашбордов)
    server {
        listen 80;
        server_name grafana.localhost;

        location / {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # Loki (API, без веб-интерфейса)
    server {
        listen 80;
        server_name loki.localhost;

        location / {
            proxy_pass http://loki;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # RabbitMQ Management UI
    server {
        listen 80;
        server_name rabbitmq.localhost;

        location / {
            proxy_pass http://rabbitmq;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
