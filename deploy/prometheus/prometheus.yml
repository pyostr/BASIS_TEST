# Конфигурация Prometheus: скрейпит API, consumer-воркер, RabbitMQ и PostgreSQL.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  - job_name: consumer
    metrics_path: /metrics
    static_configs:
      - targets: ['consumer:8001']

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
