# Прод-стек basis-test (используется CI/CD: .github/workflows/master.yml).
# Подстановки ${...} берутся из .env, который генерируется в шаге Deploy.
# Внешних портов нет — всё общается внутри приватной сети ${NETWORK}.
# API: blue/green c alias 'api' (ротация без даунтайма).
# Остальное (rabbitmq, consumer, observability) — статичные сервисы.
name: basis-test

services:
  db:
    image: postgres:17-alpine
    container_name: ${APP_NAME}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - webnet

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - webnet

  web-blue:
    image: ${IMAGE}
    container_name: ${APP_NAME}-blue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/liveness"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment: &web-env
      ENVIRONMENT: ${ENVIRONMENT:-production}
      STRICT_STARTUP: "true"
      DOCS_ENABLED: "true"
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      PAYMENTS_API_KEYS: ${PAYMENTS_API_KEYS:-["dev-key"]}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-webhook-dev-secret}
    # Loopback-порты для host-nginx (blue=8001, green=8002): наружу не видны.
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      webnet:
        aliases:
          - api

  web-green:
    image: ${IMAGE}
    container_name: ${APP_NAME}-green
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/liveness"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      <<: *web-env
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      webnet:
        aliases:
          - api

  consumer:
    image: ${IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      GATEWAY_MIN_DELAY: ${GATEWAY_MIN_DELAY:-2.0}
      GATEWAY_MAX_DELAY: ${GATEWAY_MAX_DELAY:-5.0}
      GATEWAY_FAILURE_RATE: ${GATEWAY_FAILURE_RATE:-0.1}
      WEBHOOK_RETRY_ATTEMPTS: ${WEBHOOK_RETRY_ATTEMPTS:-3}
      WEBHOOK_RETRY_BASE_DELAY: ${WEBHOOK_RETRY_BASE_DELAY:-1.0}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-webhook-dev-secret}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      METRICS_PORT: 8001
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1.0}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
    command: ["python", "-m", "src.runtime.bootstrap.worker_main"]
    networks:
      - webnet

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"
    networks:
      - webnet

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - consumer
      - postgres-exporter
      - rabbitmq
    networks:
      - webnet

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yml
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki
    networks:
      - webnet

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    volumes:
      - ./deploy/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - webnet

  grafana:
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    # Loopback-порт для host-nginx (grafana.demo-market.ru): наружу не виден.
    ports:
      - "127.0.0.1:3003:3000"
    volumes:
      - ./deploy/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - webnet

networks:
  webnet:
    external: true
    name: ${NETWORK:-BASIS_NETWORK}

volumes:
  pgdata:
    name: ${APP_NAME}-bluegreen-pgdata
  prometheus_data:
    name: ${APP_NAME}-prometheus-data
  loki_data:
    name: ${APP_NAME}-loki-data
  grafana_data:
    name: ${APP_NAME}-grafana-data
