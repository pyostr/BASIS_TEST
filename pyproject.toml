[project]
name = "demo-service"
version = "0.1.0"
description = ""
authors = [
    {name = "www",email = "pyostr@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "redis (>=7.4.0,<8.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "infisicalsdk (>=1.0.16,<2.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "scalar-fastapi (>=1.8.2,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "faststream[rabbit] (>=0.7.3,<0.8.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.12,<0.16.0"
pre-commit = ">=4.6.0,<5.0.0"
pytest = ">=9.0.3,<10.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"
testcontainers = { version = ">=4.15.0,<5.0.0", extras = ["rabbitmq"] }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (ВАЖНО: теперь это внутри ruff)
    "B",   # bugbear
    "Q",   # flake8-quotes (одинарные кавычки)
    "UP",  # pyupgrade
]

ignore = [
    "E501",  # line length (black уже решает)
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
known-first-party = [
    "src",
]

[tool.ruff.lint.per-file-ignores]
"**/di/**/*.py" = ["B008"]
"**/presentation/**/*.py" = ["B008"]